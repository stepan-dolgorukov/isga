services:
  tracker:
    build: ./tracker
    environment:
      DB_PATH: /data/phishing.db
    volumes:
      - ./data:/data
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8084:8084"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - tracker
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    restart: unless-stopped

  mailer:
    build: ./mailer
    profiles:
      - mailer
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: security-team@company.local
      BASE_URL: http://localhost:8084
    volumes:
      - ./mailer/users.csv:/app/users.csv:ro
    depends_on:
      - mailpit
